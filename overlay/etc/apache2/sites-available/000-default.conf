ServerName localhost

<VirtualHost *:80>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/
    # the two app trees are served only by their own vhosts (ports 5443/8443)
    RedirectMatch 404 "^/app-php[58](/|$)"
    <IfModule mod_headers.c>
        Header always unset Upgrade
    </IfModule>
</VirtualHost>

<VirtualHost *:443>
    SSLEngine on
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/
    # the two app trees are served only by their own vhosts (ports 5443/8443)
    RedirectMatch 404 "^/app-php[58](/|$)"
</VirtualHost>

<Directory /var/www/>
    Options Indexes FollowSymLinks MultiViews
    Require all granted
</Directory>
